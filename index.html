 return `<h1>ホーム</h1><p class="sub">志望大学：${e(UN[D.set.uni])}　目標レベル：${LV[D.set.level]}</p>
 <div class="card"><h2>今日の学習</h2><div class="big">${Math.min(dn,n)} / ${n} 問</div><div class="pb"><i style="width:${Math.min(100,pct(dn,n))}%"></i></div>
 <p class="sub">完了率 ${Math.min(100,pct(dn,n))}%${dn>=n?'　今日の'+n+'問は完了しました':''}</p>
 ${open?'<button class="w" onclick="location.hash=\'#/study\'">続きから再開する</button>':`<button class="w" onclick="start('daily')">${dn>=n?'もう一度学習する':'今日の'+n+'問を始める'}</button>`}</div>
 <div class="g2"><div class="card"><h2>復習リスト</h2><div class="big">${rc}語</div><p class="sub">未復習</p><button class="o" onclick="location.hash='#/review'">開く</button></div>
 <div class="card"><h2>学習履歴</h2><div class="big">${D.log.length}問</div><p class="sub">累計解答数</p><button class="o" onclick="location.hash='#/history'">開く</button></div></div>
 <div class="card"><h2>今週の学習状況</h2><div class="wk">${wk}</div></div>`;
}
function settings(){
 const s=D.set,nv=Math.round(s.n/3);
 return `<h1>学習設定</h1><div class="card"><h2>志望大学</h2><select id="su">${UN.map((u,i)=>`<option value="${i}" ${i==s.uni?'selected':''}>${u}</option>`).join('')}</select>
 <p class="sub">大学別データは準備中のため、現在は目標レベルのみ出題に反映されます。</p>
 <h2>目標レベル</h2>${[1,2,3,4].map(l=>`<label class="opt"><input type="radio" name="lv" value="${l}" ${l==s.level?'checked':''}> ${LV[l]}</label>`).join('')}
 <h2>出題形式（複数選択可）</h2>${Object.keys(TN).map(t=>`<label class="opt"><input type="checkbox" class="ty" value="${t}" ${s.types.includes(t)?'checked':''}> ${TN[t]}</label>`).join('')}
 <h2>1日の問題数</h2><select id="sn2">${[10,15,20].map(n=>`<option value="${n}" ${n==s.n?'selected':''}>${n} 問</option>`).join('')}</select>
 <p class="sub">出題構成の目安：新出単語 ${s.n-nv}問 / 復習 ${nv}問（復習が不足する場合は新出単語で補います）</p>
 <button class="w" onclick="saveSet()">設定を保存</button><p id="sm" class="sub"></p></div>`;
}
function saveSet(){
 const ty=[...document.querySelectorAll('.ty:checked')].map(x=>x.value);
 if(!ty.length){$('#sm').textContent='問題形式を1つ以上選んでください。';return}
 D.set={uni:+$('#su').value,level:+document.querySelector('[name=lv]:checked').value,types:ty,n:+$('#sn2').value};
 save();$('#sm').textContent='設定を保存しました。';
}
function study(){
 const S=D.S;
 if(!S)return `<h1>学習</h1><div class="card"><p>進行中の学習はありません。</p><button class="w" onclick="start('daily')">今日の${D.set.n}問を始める</button></div>`;
 const i=S.fb!=null?S.fb:S.qs.findIndex(q=>!q.done);
 if(i<0){setTimeout(()=>location.hash='#/result');return''}
 const q=S.qs[i],w=W[q.w],tot=S.qs.length,last=!S.qs.some(x=>!x.done);
 const hd=`<div class="row"><b>${S.kind=='daily'?'学習中':'復習中'}</b><span>${i+1} / ${tot} 問</span></div><div class="pb"><i style="width:${(i+(q.done?1:0))/tot*100}%"></i></div><p class="sub">${TN[q.t]}問題</p>`;
 const label=x=>q.t=='je'?W[x][0]:W[x][1];
 if(!q.done){
  const p=q.t=='ej'?w[0]:w[1];
  const ins=q.t=='je'?'次の日本語に対応する英単語を選びなさい。':q.t=='ej'?'次の英単語の意味を選びなさい。':'次の日本語に対応する英単語を入力しなさい。';
  const body=q.t=='w'?`<input type="text" id="wi" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英単語を入力" onkeydown="if(event.key=='Enter')ans()">`
   :q.c.map((x,k)=>`<button class="ch ${sel===k?'sel':''}" onclick="pick(${k})">${'ABCD'[k]}. ${e(label(x))}</button>`).join('');
  return `<div class="card">${hd}<p>${ins}</p><div class="q">${e(p)}</div>${body}<button class="w" style="margin-top:8px" onclick="ans()" ${q.t!='w'&&sel==null?'disabled':''}>解答する</button></div>`;
 }
 const ban=q.ok?'<div class="ban ok">✓ 正解！</div>':'<div class="ban ng">✗ 不正解</div>';
 let det;
 if(q.t=='w')det=`<p>あなたの回答：${e(q.a)}</p><div class="it c"><b>${w[0]}</b>【正解】<br>${w[1]}（${w[2]}）</div>`;
 else det=`<p>問題：${e(q.t=='je'?w[1]:w[0])}<br>あなたの回答：${'ABCD'[q.a]}. ${e(label(q.c[q.a]))}</p><h2>すべての選択肢と意味</h2>`+
  q.c.map((x,k)=>`<div class="it ${x==q.w?'c':k==q.a?'m':''}"><b>${'ABCD'[k]}. ${W[x][0]}</b>${x==q.w?'<span class="tag" style="color:var(--ok)">【正解】</span>':k==q.a?'<span class="tag" style="color:var(--ng)">【あなたの回答】</span>':''}<br>${W[x][1]}</div>`).join('');
 return `<div class="card">${hd}${ban}${det}<h2>解説</h2><p>${w[0]} は「${w[1]}」を意味する${w[2]}です。</p><p class="sub">${w[3]}<br>${w[4]}</p><button class="w" onclick="next()">${last?'結果を見る':'次の問題へ'}</button></div>`;
}
function result(){
 const S=D.S;if(!S)return home();
 const a=S.qs.filter(q=>q.done),c=a.filter(q=>q.ok).length,wr=a.filter(q=>!q.ok);
 const by=Object.keys(TN).map(t=>{const x=a.filter(q=>q.t==t);return x.length?`<tr><td>${TN[t]}</td><td>${x.filter(q=>q.ok).length} / ${x.length}</td><td>${pct(x.filter(q=>q.ok).length,x.length)}%</td></tr>`:''}).join('');
 return `<div class="card"><h1 style="text-align:center">学習結果</h1><div class="g3"><div><div class="big">${c}</div><span class="sub">正解数</span></div><div><div class="big">${a.length-c}</div><span class="sub">不正解数</span></div><div><div class="big">${pct(c,a.length)}%</div><span class="sub">正答率</span></div></div></div>
 <div class="card"><h2>問題形式別の成績</h2><table>${by}</table></div>
 <div class="card"><h2>間違えた単語</h2><p>${wr.length?wr.map(q=>W[q.w][0]).join(' / '):'ありません。よくできました！'}</p></div>
 ${wr.length?`<button class="w" style="margin-bottom:8px" onclick="start('review',[${wr.map(q=>q.w)}])">間違えた単語を復習する</button>`:''}
 <button class="w o" style="margin-bottom:8px" onclick="start('daily')">もう一度挑戦する</button><button class="w o" onclick="location.hash='#/home'">ホームへ戻る</button>`;
}
function review(){
 const ids=Object.keys(D.rv).filter(k=>D.rv[k].status=='復習中');
 const rows=ids.map(k=>`<tr><td><b>${W[k][0]}</b></td><td>${W[k][1]}</td><td>${D.rv[k].n}回</td><td style="white-space:nowrap"><button class="o" onclick="start('review',[${k}])">復習する</button> <button class="d" onclick="del(${k})">削除</button></td></tr>`).join('');
 return `<h1>復習リスト　${ids.length}語</h1><div class="card">${ids.length?`<div style="overflow-x:auto"><table><tr><th>単語</th><th>意味</th><th>間違い</th><th></th></tr>${rows}</table></div><button class="w" style="margin-top:16px" onclick="start('review',[${ids.slice(0,20)}])">すべて復習する</button>`:'<p>復習する単語はありません。間違えた単語はここに自動で登録されます。</p>'}</div>`;
}
function del(k){if(confirm(W[k][0]+' を復習リストから削除しますか？')){delete D.rv[k];save();r()}}
function history(){
 const L=D.log,c=L.filter(l=>l.ok).length,ds=new Set(L.map(l=>l.d));
 if(!L.length)return '<h1>学習履歴</h1><div class="card"><p>学習するとここに記録されます。</p></div>';
 let k=ds.has(day(0))?0:1,st=0;while(ds.has(day(k))){st++;k++}
 const bars=[6,5,4,3,2,1,0].map(k=>{const x=L.filter(l=>l.d==day(k)),p=pct(x.filter(l=>l.ok).length,x.length);return `<div><span>${x.length?p+'%':'-'}</span><i style="height:${p}px"></i>${day(k).slice(5)}</div>`}).join('');
 const by=Object.keys(TN).map(t=>{const x=L.filter(l=>l.t==t);return x.length?`<tr><td>${TN[t]}</td><td>${x.filter(l=>l.ok).length} / ${x.length}</td><td>${pct(x.filter(l=>l.ok).length,x.length)}%</td></tr>`:''}).join('');
 const wk={};L.filter(l=>!l.ok).forEach(l=>wk[l.w]=(wk[l.w]||0)+1);
 const top=Object.entries(wk).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w,n])=>`<tr><td><b>${W[w][0]}</b></td><td>${W[w][1]}</td><td>${n}回</td></tr>`).join('');
 return `<h1>学習履歴</h1><div class="g3 card"><div><div class="big">${L.length}</div><span class="sub">累計解答数</span></div><div><div class="big">${pct(c,L.length)}%</div><span class="sub">累計正答率（正解${c}）</span></div><div><div class="big">${st}日</div><span class="sub">連続学習日数</span></div></div>
 <div class="card"><h2>日ごとの正答率（直近7日）</h2><div class="bars">${bars}</div></div>
 <div class="g2"><div class="card"><h2>問題形式ごとの正答率</h2><table>${by}</table></div><div class="card"><h2>苦手単語</h2><table>${top||'<tr><td>なし</td></tr>'}</table></div></div>`;
}
function vocab(){return `<h1>単語帳　全${W.length}語</h1><p class="sub">検索結果は先頭50件まで表示します。</p><div class="card"><input type="text" id="vs" placeholder="英単語・意味を検索" oninput="vl(this.value)"></div>${impCard()}<div id="vl">${vlh('')}</div>`}
function vlh(q){q=q.toLowerCase();return W.map((w,i)=>({w,i})).filter(x=>!q||x.w[0].toLowerCase().includes(q)||x.w[1].includes(q)).slice(0,50).map(({w,i})=>`<div class="card"><h2>${w[0]}</h2><p>意味：${w[1]}<br>品詞：${w[2]}${w[3]?'<br>例文：'+w[3]+'<br>訳：'+w[4]:''}</p>
 <button class="o" onclick="fav(${i})">${D.fav.includes(i)?'★ お気に入り済み':'☆ お気に入り'}</button> <button class="o" onclick="addRv(${i})">${D.rv[i]&&D.rv[i].status=='復習中'?'復習リストに登録済み':'復習リストに追加'}</button></div>`).join('')||'<div class="card">見つかりませんでした。</div>'}
function vl(q){$('#vl').innerHTML=vlh(q)}
function fav(i){const k=D.fav.indexOf(i);k<0?D.fav.push(i):D.fav.splice(k,1);save();vl($('#vs').value)}
function addRv(i){if(!D.rv[i]||D.rv[i].status!='復習中')D.rv[i]={n:D.rv[i]?D.rv[i].n:0,s:0,status:'復習中'};save();vl($('#vs').value)}
function impCard(){return `<div class="card"><h2>単語データのインポート</h2><p class="sub">お手持ちの単語リスト（CSV/TSV）を追加できます。1行に「英単語,意味,品詞,例文,例文訳,レベル(1〜4)」の順で入力してください。英単語と意味は必須で、同じ英単語は追加しません。</p><input type="file" id="if" accept=".csv,.tsv,.txt" onchange="fileImp(this)"><textarea id="it" rows="4" style="width:100%;margin:8px 0;font:inherit;padding:8px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)" placeholder="abandon,捨てる、放棄する,動詞,They abandoned the plan.,彼らは計画を放棄した。,3"></textarea><button class="w" onclick="doImp($('#it').value)">追加する</button><p id="im" class="sub">追加済み：${D.imp.length}語</p>${D.imp.length?'<button class="d" onclick="clrImp()">追加した単語をすべて削除</button>':''}</div>`}
function cells(l){if(l.includes('\t'))return l.split('\t').map(x=>x.trim());const o=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==','&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o}
function doImp(t){const have=new Set(W.map(w=>w[0].toLowerCase()));let n=0,sk=0;
 t.split(/\r?\n/).forEach(l=>{if(!l.trim())return;const c=cells(l);if(!c[0]||!c[1]||/^(英単語|word)$/i.test(c[0])){sk++;return}
  const k=c[0].toLowerCase();if(have.has(k)){sk++;return}have.add(k);
  const w=[c[0],c[1],c[2]||'',c[3]||'',c[4]||'',Math.min(4,Math.max(1,parseInt(c[5])||2))];D.imp.push(w);W.push(w);n++});
 save();r(1);$('#im').textContent=n+'語を追加しました（スキップ '+sk+'行）。合計 '+W.length+'語'}
function fileImp(i){const f=i.files[0];if(f)f.text().then(doImp)}
function clrImp(){if(!confirm('追加した単語と、それに関する学習記録を削除しますか？'))return;D.imp=[];W.length=BASE;Object.keys(D.rv).forEach(k=>{if(+k>=BASE)delete D.rv[k]});D.log=D.log.filter(l=>l.w<BASE);D.fav=D.fav.filter(i=>i<BASE);D.S=null;save();r()}
const NAV=[['home','ホーム'],['study','学習'],['review','復習'],['history','履歴'],['vocab','単語帳']];
function r(keep){
 const h=location.hash.slice(2)||'home',R={home,settings,study,result,review,history,vocab};
 const act=document.activeElement&&document.activeElement.id=='wi'?$('#wi').value:null;
 $('#m').innerHTML=(R[h]||home)();
 if(act!==null&&$('#wi'))$('#wi').value=act;
 if($('#wi'))$('#wi').focus({preventScroll:true});
 const a=NAV.map(([k,t])=>`<a href="#/${k}" class="${k==h?'on':''}">${t}</a>`).join('');
 $('#sn').innerHTML=a+`<a href="#/settings" class="${h=='settings'?'on':''}">設定</a>`;$('#mn').innerHTML=a;
 if(!keep)window.scrollTo(0,0);
}
addEventListener('hashchange',()=>r());r();
</script></body></html>
